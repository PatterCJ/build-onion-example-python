# Every pull request runs build-onion's build line: staged inputs, restricted
# fetch, hermetic build and image. Pull request builds are never sealed. Fork
# pull requests get no OIDC token, so they skip it.
name: ci

on:
  pull_request:

permissions: {}

# Every step runs with -e -o pipefail: a failing command in a pipe (such as
# `onion peel | tee`) fails the step.
defaults:
  run:
    shell: bash

jobs:
  build-line:
    if: ${{ !github.event.pull_request.head.repo.fork }}
    permissions:
      contents: read
      id-token: write
    uses: PatterCJ/build-onion/.github/workflows/onion-build.yml@98b8686b6e079986f9345bd42c6679303349baa4 # v0.5.0
    with:
      policy: .build-onion/policy.yml
