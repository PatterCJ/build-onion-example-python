# Builds this repo through build-onion's three lines, records a pip-audit
# scan against the exact source snapshot, and publishes only what verifies.
# Releases come only from signed v* tags; pull requests are checked by ci.yml.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

# Every step runs with -e -o pipefail: a failing command in a pipe (such as
# `onion peel | tee`) fails the step.
defaults:
  run:
    shell: bash

jobs:
  build:
    permissions:
      contents: read
      id-token: write
    uses: PatterCJ/build-onion/.github/workflows/onion-build.yml@58ad2ec8d5b2bac8da22fa1bf3184bf5d449776c # v0.3.0
    with:
      policy: .build-onion/policy.yml

  # The pipeline's own scan. build-onion records that it ran, when, and
  # against which snapshot; what it found is for this repo's owners to act on.
  pip-audit:
    name: scan (pip-audit)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ONION: /tmp/onion-bin/onion
      SNAPSHOT: ${{ needs.build.outputs.snapshot }}
      PIP_AUDIT: pip-audit==2.10.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: onion-cli
          path: /tmp/onion-bin
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: onion-snapshot
          path: /tmp/onion-snap
      - name: Audit the locked requirements and record the scan
        env:
          CLI_DIGEST: ${{ needs.build.outputs.cli-digest }}
        run: |
          echo "$CLI_DIGEST  $ONION" | sha256sum -c
          chmod +x "$ONION"
          "$ONION" source verify --snapshot /tmp/onion-snap/source.json --expect "$SNAPSHOT"
          python3 -m venv /tmp/audit && /tmp/audit/bin/pip install -q "$PIP_AUDIT"
          mkdir -p /tmp/onion-rec /tmp/scan-report
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # pip-audit exits 1 when it finds vulnerabilities; that is a finding
          # for this repo, not an incomplete analysis. Other failures are.
          rc=0
          /tmp/audit/bin/pip-audit --strict --require-hashes -r requirements.txt -f json -o /tmp/scan-report/pip-audit.json || rc=$?
          finished=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          status=(--status completed)
          [ "$rc" -le 1 ] || status=(--status failed --coverage "pip-audit exited $rc")
          "$ONION" record scan --name pip-audit --tool pip-audit --version "${PIP_AUDIT##*==}" \
            --stage pre-build --started "$started" --finished "$finished" "${status[@]}" \
            --subject-kind source --subject "$SNAPSHOT" \
            --report /tmp/scan-report/pip-audit.json \
            --report-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --out /tmp/onion-rec/scan-pip-audit.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onion-record-scan-pip-audit
          path: /tmp/onion-rec
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-report-pip-audit
          path: /tmp/scan-report
          if-no-files-found: error

  verify:
    needs: [build, pip-audit]
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: PatterCJ/build-onion/.github/workflows/onion-verify.yml@58ad2ec8d5b2bac8da22fa1bf3184bf5d449776c # v0.3.0
    with:
      snapshot: ${{ needs.build.outputs.snapshot }}
      releasable: ${{ needs.build.outputs.releasable }}
      policy: .build-onion/policy.yml

  # The release before this one: the publish line compares with it.
  previous:
    name: previous release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      image: ${{ steps.find.outputs.image }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --json tagName --jq '.[].tagName' \
            | grep -vx "$GITHUB_REF_NAME" | head -1 || true)
          echo "previous release: ${tag:-none}"
          if [ -n "$tag" ]; then echo "image=ghcr.io/pattercj/build-onion-example-python:$tag" >> "$GITHUB_OUTPUT"; fi

  publish:
    needs: [build, verify, previous]
    if: needs.build.outputs.releasable == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: PatterCJ/build-onion/.github/workflows/onion-publish.yml@58ad2ec8d5b2bac8da22fa1bf3184bf5d449776c # v0.3.0
    with:
      image-digest: ${{ needs.verify.outputs.image-digest }}
      baseline: ${{ needs.previous.outputs.image }}
